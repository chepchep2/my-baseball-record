name: PR Check

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mbr_test
          POSTGRES_USER: mbr_test
          POSTGRES_PASSWORD: mbr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mbr_test -d mbr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mbr_test
      SPRING_DATASOURCE_USERNAME: mbr_test
      SPRING_DATASOURCE_PASSWORD: mbr_test
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run tests
        run: ./gradlew test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
