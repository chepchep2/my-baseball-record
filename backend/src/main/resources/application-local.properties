spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/my_baseball_record}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=${FLYWAY_ENABLED:false}

auth.jwt.secret=${JWT_SECRET:change-me-in-local-env}
auth.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
auth.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TOKEN_TTL_SECONDS:2592000}
auth.google.client-id=${GOOGLE_CLIENT_ID:}
auth.kakao.client-id=${KAKAO_CLIENT_ID:}
auth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
auth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
auth.kakao.frontend-redirect-uri=${KAKAO_FRONTEND_REDIRECT_URI:http://localhost:3000/home}
auth.kakao.authorize-base-url=${KAKAO_AUTHORIZE_BASE_URL:https://kauth.kakao.com}
auth.kakao.api-base-url=${KAKAO_API_BASE_URL:https://kapi.kakao.com}
auth.kakao.token-path=${KAKAO_TOKEN_PATH:/oauth/token}
auth.kakao.user-info-path=${KAKAO_USER_INFO_PATH:/v2/user/me}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}
