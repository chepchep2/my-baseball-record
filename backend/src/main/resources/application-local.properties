spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/my_baseball_record}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=${FLYWAY_ENABLED:false}

auth.jwt.secret=${JWT_SECRET:change-me-in-local-env}
auth.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
auth.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TOKEN_TTL_SECONDS:2592000}
auth.google.client-id=${GOOGLE_CLIENT_ID:}
