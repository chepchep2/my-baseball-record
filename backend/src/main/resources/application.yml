spring:
  application:
    name: my-baseball-record-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/my_baseball_record
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

server:
  port: 8080
