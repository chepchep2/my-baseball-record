spring.datasource.url=jdbc:h2:mem:baseball-record;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
auth.jwt.secret=test-secret-key-for-jwt-signing-123456
auth.jwt.access-token-ttl-seconds=3600
auth.jwt.refresh-token-ttl-seconds=2592000
auth.google.client-id=test-google-client-id
auth.google.base-url=https://oauth2.googleapis.com
auth.google.token-info-path=/tokeninfo
